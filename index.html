<style>
:root{
--primary:#2563eb;--primary-dark:#1d4ed8;--success:#16a34a;--danger:#dc2626;
--warning:#f59e0b;--bg:#f1f5f9;--card:#ffffff;--text:#1e293b;--text-light:#64748b;
--border:#e2e8f0;--best:#ef4444;--sold-out:#9ca3af;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.hidden{display:none!important}
/* 토스트 */
.toast-container{position:fixed;top:20px;right:20px;z-index:9999}
.toast{padding:12px 20px;border-radius:8px;color:#fff;margin-bottom:8px;animation:slideIn .3s;font-size:14px;max-width:300px}
.toast.success{background:var(--success)}.toast.error{background:var(--danger)}.toast.warning{background:var(--warning)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
/* 로그인 */
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{background:var(--card);padding:40px;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.1);width:100%;max-width:400px}
.login-box h1{text-align:center;margin-bottom:8px;color:var(--primary)}
.login-box p{text-align:center;color:var(--text-light);margin-bottom:24px;font-size:14px}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-weight:600;font-size:14px}
.form-group input,.form-group select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.btn{padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-success{background:var(--success);color:#fff}.btn-danger{background:var(--danger);color:#fff}
.btn-warning{background:var(--warning);color:#fff}.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-outline:hover{background:var(--bg)}.btn-sm{padding:6px 12px;font-size:12px}
.btn-block{width:100%;padding:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* 네비게이션 */
nav{background:linear-gradient(135deg,#1e293b 0%,#334155 100%);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
nav .logo{color:#fff;font-size:18px;font-weight:700}
nav .nav-links{display:flex;gap:8px;flex-wrap:wrap}
nav .nav-links a{color:rgba(255,255,255,.7);text-decoration:none;padding:6px 12px;border-radius:6px;font-size:13px;transition:all .2s}
nav .nav-links a:hover,nav .nav-links a.active{color:#fff;background:rgba(255,255,255,.1)}
nav .nav-right{display:flex;align-items:center;gap:12px}
nav .nav-right .user-name{color:#fff;font-size:13px}
nav .nav-right .badge{background:var(--warning);color:#000;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
nav .nav-right .btn-logout{background:rgba(255,255,255,.1);color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer}
/* 메인 컨테이너 */
.container{max-width:1400px;margin:0 auto;padding:20px}
/* 카드 */
.card{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:16px}
.card h2{font-size:18px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border)}
/* 통계 카드 */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.stat-card{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.stat-card .stat-value{font-size:28px;font-weight:700;color:var(--primary)}
.stat-card .stat-label{font-size:13px;color:var(--text-light);margin-top:4px}
/* 테이블 */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border)}
th{background:var(--bg);font-weight:600;position:sticky;top:0}
tr:hover{background:#f8fafc}
/* 상품 그리드 */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.product-card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:transform .2s}
.product-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.1)}
.product-card .product-img{width:100%;height:160px;object-fit:cover;background:#f1f5f9;display:flex;align-items:center;justify-content:center;overflow:hidden}
.product-card .product-img img{width:100%;height:100%;object-fit:cover}
.product-card .product-img .no-img{color:var(--text-light);font-size:40px}
.product-card .product-info{padding:16px}
.product-card .product-name{font-weight:700;font-size:15px;margin-bottom:4px}
.product-card .product-price{color:var(--primary);font-weight:600;font-size:14px}
.product-card .product-margin{color:var(--success);font-size:12px}
.product-card .product-badges{display:flex;gap:4px;margin-top:8px}
.product-card .badge-best{background:var(--best);color:#fff;padding:2px 8px;border-radius:10px;font-size:11px}
.product-card .badge-soldout{background:var(--sold-out);color:#fff;padding:2px 8px;border-radius:10px;font-size:11px}
.product-card .product-actions{padding:0 16px 16px;display:flex;gap:8px}
/* 모달 */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:600px;max-height:90vh;overflow-y:auto;padding:24px}
.modal h3{font-size:18px;margin-bottom:16px}
.modal-lg{max-width:900px}
/* 필터 바 */
.filter-bar{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.filter-bar input,.filter-bar select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px}
/* 차트 */
.chart-container{height:200px;display:flex;align-items:flex-end;gap:4px;padding:20px 0}
.chart-bar{background:var(--primary);border-radius:4px 4px 0 0;min-width:30px;transition:height .3s;position:relative}
.chart-bar:hover{background:var(--primary-dark)}
.chart-bar .chart-tooltip{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:4px 8px;border-radius:4px;font-size:11px;white-space:nowrap;display:none}
.chart-bar:hover .chart-tooltip{display:block}
/* 장바구니 뱃지 */
.cart-badge{position:relative}
.cart-badge .cart-count{position:absolute;top:-5px;right:-5px;background:var(--danger);color:#fff;width:18px;height:18px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center}
/* 상태 뱃지 */
.status-badge{padding:3px 10px;border-radius:10px;font-size:11px;font-weight:600}
.status-unordered{background:#fef3c7;color:#92400e}
.status-ordered{background:#dbeafe;color:#1e40af}
.status-shipping{background:#d1fae5;color:#065f46}
.status-cancelled{background:#fee2e2;color:#991b1b}
/* 수령인 자동완성 */
.autocomplete-list{position:absolute;background:#fff;border:1px solid var(--border);border-radius:8px;max-height:150px;overflow-y:auto;width:100%;z-index:50;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.autocomplete-item{padding:8px 12px;cursor:pointer;font-size:13px}
.autocomplete-item:hover{background:var(--bg)}
/* 승인 대기 */
.approval-item{border:1px solid var(--warning);border-radius:8px;padding:12px;margin-bottom:8px}
/* 반응형 */
@media(max-width:768px){
nav{flex-direction:column;gap:8px}
nav .nav-links{justify-content:center}
.stats-grid{grid-template-columns:1fr 1fr}
.product-grid{grid-template-columns:1fr}
.modal{margin:10px}
}
</style>
</head>

// ========== Firebase 데이터 로드/저장 ==========
async function loadState() {
const snapshot = await db.ref('state').once('value');
const data = snapshot.val();
if (data) {
STATE = {...STATE, ...data};
if (!STATE.approvals) STATE.approvals = [];
if (!STATE.recipients) STATE.recipients = [];
} else {
STATE.products = DEFAULT_PRODUCTS;
STATE.staff = DEFAULT_STAFF;
await saveState();
}
}

function saveState() {
return db.ref('state').set(STATE);
}

function saveOrders() {
return db.ref('state/orders').set(STATE.orders || []);
}

function saveProducts() {
return db.ref('state/products').set(STATE.products || []);
}

function saveStaff() {
return db.ref('state/staff').set(STATE.staff || []);
}

function saveApprovals() {
return db.ref('state/approvals').set(STATE.approvals || []);
}

// ========== 유틸리티 ==========
function toast(msg, type='success') {
const el = document.createElement('div');
el.className = `toast ${type}`;
el.textContent = msg;
document.getElementById('toastContainer').appendChild(el);
setTimeout(() => el.remove(), 3000);
}

function formatNum(n) {
return Number(n).toLocaleString();
}

function formatDate(d) {
return new Date(d).toLocaleString('ko-KR');
}

function generateId() {
return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

function parseOption(optStr) {
const idx = optStr.indexOf(' ');
if (idx === -1) return {code: optStr, name: ''};
return {code: optStr.substring(0, idx), name: optStr.substring(idx + 1)};
}

function calcIncentive(qty) {
return qty >= 2 ? (qty - 1) * 1500 : 0;
}

const mode = document.getElementById('loginMode').value;
document.getElementById('staffSelectGroup').classList.toggle('hidden', mode === 'admin');

function populateStaffSelect() {

async function doLogin() {
const mode = document.getElementById('loginMode').value;
const pw = document.getElementById('loginPw').value;

if (mode === 'admin') {
if (pw === STATE.adminPassword) {
currentMode = 'admin';
currentUser = {id: 'admin', name: '관리자'};
} else {
toast('비밀번호가 틀립니다', 'error');
return;
}
} else {
const staffId = document.getElementById('staffSelect').value;
if (!staffId) { toast('직원을 선택하세요', 'error'); return; }
const staff = STATE.staff.find(s => s.id === staffId);
if (!staff) { toast('직원을 찾을 수 없습니다', 'error'); return; }
if (pw !== staff.password) { toast('비밀번호가 틀립니다', 'error'); return; }
currentMode = 'staff';
currentUser = staff;
}

document.getElementById('loginPage').classList.add('hidden');
document.getElementById('mainApp').classList.remove('hidden');
document.getElementById('userName').textContent = currentUser.name;
document.getElementById('modeBadge').textContent = currentMode === 'admin' ? '관리자' : '직원';
buildNav();
navigateTo(currentMode === 'admin' ? 'dashboard' : 'products');
}

function doLogout() {
currentUser = null;
currentMode = null;
cart = [];
document.getElementById('mainApp').classList.add('hidden');
document.getElementById('loginPage').classList.remove('hidden');
document.getElementById('loginPw').value = '';
}

</div>

<h2>공지사항</h2>

<button class="btn btn-primary btn-sm" onclick="saveNotice()">저장</button>
</div>
</div>
`;
renderMarginChart();
}

function renderMarginChart() {
const chart = document.getElementById('marginChart');
if (!chart) return;
const days = [];
for (let i = 6; i >= 0; i--) {
const d = new Date(); d.setDate(d.getDate() - i);
days.push(d.toISOString().slice(0, 10));
}
const margins = days.map(day => {
return STATE.orders.filter(o => o.date && o.date.startsWith(day))
.reduce((sum, o) => sum + ((o.margin || 0) * o.qty), 0);
});
const max = Math.max(...margins, 1);
chart.innerHTML = days.map((day, i) => `
<div style="flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%">
<div class="chart-bar" style="height:${(margins[i]/max)*150}px;width:100%;max-width:40px">
<div class="chart-tooltip">${formatNum(margins[i])}원</div>
</div>
<div style="font-size:11px;margin-top:4px;color:var(--text-light)">${day.slice(5)}</div>
</div>
`).join('');
}

function saveNotice() {

function filterOrders() {
const staff = document.getElementById('filterStaff')?.value || '';
const status = document.getElementById('filterStatus')?.value || '';
const from = document.getElementById('filterDateFrom')?.value || '';
const to = document.getElementById('filterDateTo')?.value || '';
const recipient = document.getElementById('filterRecipient')?.value || '';

let orders = [...STATE.orders].reverse();
if (staff) orders = orders.filter(o => o.staffId === staff);
if (status) orders = orders.filter(o => o.status === status);
if (from) orders = orders.filter(o => o.date >= from);
if (to) orders = orders.filter(o => o.date <= to + 'T23:59:59');
if (recipient) orders = orders.filter(o => o.recipient && o.recipient.includes(recipient));

const table = document.getElementById('ordersTable');
if (!table) return;
table.innerHTML = `
<thead><tr>
<th>일시</th><th>직원</th><th>상품</th><th>옵션</th><th>수량</th><th>수령인</th><th>연락처</th><th>상태</th><th>마진</th><th>송장</th><th>관리</th>
</tr></thead>
<tbody>
${orders.map(o => {
const staff = STATE.staff.find(s => s.id === o.staffId);
return `<tr>
<td>${o.date ? formatDate(o.date) : ''}</td>
<td>${staff ? staff.name : o.staffId}</td>
<td>${o.productName || ''}</td>
<td>${o.optionName || ''}</td>
<td>${o.qty}</td>
<td>${o.recipient || ''}</td>
<td>${o.phone || ''}</td>
<td><span class="status-badge status-${o.status === '미발주' ? 'unordered' : o.status === '발주완료' ? 'ordered' : o.status === '배송중' ? 'shipping' : 'cancelled'}">${o.status}</span></td>
<td><input type="number" value="${o.margin || 0}" style="width:60px" onchange="updateMargin('${o.id}',this.value)"></td>
<td>${o.invoice ? `<a href="${getTrackingUrl(o.courier, o.invoice)}" target="_blank">${o.invoice}</a>` : '<span style="color:#aaa">-</span>'}</td>
<td>
${o.status === '미발주' ? `<button class="btn btn-danger btn-sm" onclick="cancelOrder('${o.id}')">취소</button>` : ''}
${o.status === '미발주' ? `<button class="btn btn-sm btn-outline" onclick="enterInvoice('${o.id}')">송장</button>` : ''}
${o.status === '발주완료' ? `<button class="btn btn-sm btn-outline" onclick="enterInvoice('${o.id}')">송장</button>` : ''}
</td>
</tr>`;
}).join('')}
</tbody>
`;
}

function updateMargin(orderId, val) {
const order = STATE.orders.find(o => o.id === orderId);
if (order) {
order.margin = Number(val);
saveOrders();
toast('마진 수정됨');
}
}

function cancelOrder(orderId) {
if (!confirm('이 주문을 취소하시겠습니까?')) return;
const order = STATE.orders.find(o => o.id === orderId);
if (order) {
order.status = '취소';
saveOrders();
filterOrders();
toast('주문 취소됨');
}
}

function enterInvoice(orderId) {
const courier = prompt('택배사 선택 (1: 롯데택배, 2: 한진택배):', '1');
if (!courier) return;
const invoice = prompt('송장번호 입력:');
if (!invoice) return;
const order = STATE.orders.find(o => o.id === orderId);
if (order) {
order.courier = courier === '1' ? '롯데택배' : '한진택배';
order.invoice = invoice;
order.status = '배송중';
saveOrders();
filterOrders();
toast('송장 등록 완료');
}
}

function getTrackingUrl(courier, invoice) {
if (courier === '롯데택배') return `https://www.lotteglogis.com/home/reservation/tracking/link498?InvNo=${invoice}`;
if (courier === '한진택배') return `https://www.hanjin.com/kor/CMS/DeliveryMgr/WaybillResult.do?mession-open=&wblnumText2=${invoice}`;
return '#';
}

function exportDomegook() {
const unordered = STATE.orders.filter(o => o.status === '미발주');
if (unordered.length === 0) { toast('미발주 주문이 없습니다', 'warning'); return; }

const rows = [['마켓', '상품번호', '옵션코드', '옵션명', '수량', '수령자명', '우편번호', '배송주소', '배송 상세주소', '휴대전화']];
unordered.forEach(o => {
const opt = parseOption(o.optionFull || '');
rows.push(['도매꾹', o.productCode || '', opt.code, opt.name, o.qty, o.recipient || '', o.zipcode || '', o.address || '', o.addressDetail || '', o.phone || '']);
});

const ws = XLSX.utils.aoa_to_sheet(rows);
const wb = XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb, ws, 'Sheet1');
const today = new Date().toISOString().slice(0, 10).replace(/-/g, '');
XLSX.writeFile(wb, `도매꾹_${today}.xlsx`);

// 상태 변경
unordered.forEach(o => o.status = '발주완료');
saveOrders();
filterOrders();
toast(`${unordered.length}건 발주완료 처리됨`);
}

function exportAllOrders() {
const rows = [['주문일시', '직원', '상품명', '옵션', '수량', '판매가', '마진', '인센티브', '수령인', '연락처', '주소', '상태', '송장']];
STATE.orders.forEach(o => {
const staff = STATE.staff.find(s => s.id === o.staffId);
rows.push([o.date, staff ? staff.name : '', o.productName, o.optionName || '', o.qty, o.price, o.margin, calcIncentive(o.qty), o.recipient, o.phone, (o.address || '') + ' ' + (o.addressDetail || ''), o.status, o.invoice || '']);
});
const ws = XLSX.utils.aoa_to_sheet(rows);
const wb = XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb, ws, '전체주문');
XLSX.writeFile(wb, `전체주문_${new Date().toISOString().slice(0,10)}.xlsx`);
}

function uploadInvoice() {
const input = document.createElement('input');
input.type = 'file';
input.accept = '.xlsx,.xls';
input.onchange = async(e) => {
const file = e.target.files[0];
const data = await file.arrayBuffer();
const wb = XLSX.read(data);
const ws = wb.Sheets[wb.SheetNames[0]];
const rows = XLSX.utils.sheet_to_json(ws, {header: 1});

let matched = 0;
rows.forEach(row => {
if (row.length < 3) return;
const recipient = String(row[0] || '').trim();
const invoice = String(row[1] || '').trim();
const courier = String(row[2] || '').trim();
if (!recipient || !invoice) return;

const order = STATE.orders.find(o => o.recipient === recipient && (o.status === '발주완료' || o.status === '미발주'));
if (order) {
order.invoice = invoice;
order.courier = courier || '롯데택배';
order.status = '배송중';
matched++;
}
});
saveOrders();
filterOrders();
toast(`${matched}건 송장 매칭 완료`);
};
input.click();
}

function renderStaffSalesTable() {

const content = document.getElementById('staffSalesContent');
let totalSales = 0, totalMargin = 0, totalIncentive = 0;

const rows = orders.map(o => {
const staff = STATE.staff.find(s => s.id === o.staffId);
const inc = calcIncentive(o.qty);
totalSales += o.price * o.qty;
totalMargin += (o.margin || 0) * o.qty;
totalIncentive += inc;
return `<tr>
<td>${staff ? staff.name : ''}</td>

function downloadStaffReport() {
const month = document.getElementById('salesMonth').value;
const staffId = document.getElementById('salesStaff').value;
let orders = STATE.orders.filter(o => o.date && o.date.startsWith(month) && o.status !== '취소');
if (staffId) orders = orders.filter(o => o.staffId === staffId);

const rows = [['직원명', '주문일시', '상품명', '옵션', '수량', '판매가', '마진', '인센티브', '총마진']];
let totalMargin = 0, totalIncentive = 0;
orders.forEach(o => {
const staff = STATE.staff.find(s => s.id === o.staffId);
const inc = calcIncentive(o.qty);
const marginTotal = (o.margin || 0) * o.qty;
totalMargin += marginTotal;
totalIncentive += inc;
rows.push([staff ? staff.name : '', o.date, o.productName, o.optionName || '', o.qty, o.price, o.margin, inc, marginTotal]);
});
rows.push(['합계', '', '', '', orders.reduce((s,o)=>s+o.qty,0), '', totalMargin, totalIncentive, totalMargin]);

const ws = XLSX.utils.aoa_to_sheet(rows);
const wb = XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb, ws, '매출리포트');
XLSX.writeFile(wb, `직원매출_${month}.xlsx`);
}

function showAutocomplete(input) {
const val = input.value.trim();
const list = document.getElementById('autocompleteList');
if (!val) { list.classList.add('hidden'); return; }

const matches = (STATE.recipients || []).filter(r => r.name.includes(val)).slice(0, 5);
if (matches.length === 0) { list.classList.add('hidden'); return; }

list.classList.remove('hidden');
list.innerHTML = matches.map(r => `
<div class="autocomplete-item" onclick="fillRecipient('${r.name}','${r.phone}','${r.zipcode || ''}','${r.address || ''}','${r.addressDetail || ''}')">
${r.name} (${r.phone})
</div>
`).join('');
}

function fillRecipient(name, phone, zip, addr, detail) {
document.getElementById('omRecipient').value = name;
document.getElementById('omPhone').value = phone;
if (zip) document.getElementById('omZipcode').value = zip;
if (addr) document.getElementById('omAddress').value = addr;
if (detail) document.getElementById('omAddressDetail').value = detail;
document.getElementById('autocompleteList').classList.add('hidden');
}

function searchAddress() {
new daum.Postcode({
oncomplete: function(data) {
document.getElementById('omZipcode').value = data.zonecode;
document.getElementById('omAddress').value = data.roadAddress || data.jibunAddress;
document.getElementById('omAddressDetail').focus();
}
}).open();
}

function submitOrder(productId) {
const p = STATE.products.find(pr => pr.id === productId);
const qty = Number(document.getElementById('omQty').value);
const recipient = document.getElementById('omRecipient').value.trim();
const phone = document.getElementById('omPhone').value.trim();
const zipcode = document.getElementById('omZipcode').value.trim();
const address = document.getElementById('omAddress').value.trim();
const addressDetail = document.getElementById('omAddressDetail').value.trim();
const message = document.getElementById('omMessage').value.trim();
const optionFull = document.getElementById('omOption').value;
const optionParsed = parseOption(optionFull);

if (!recipient || !phone || !address) { toast('수령인, 연락처, 주소는 필수입니다', 'error'); return; }
if (qty < 1) { toast('수량을 확인해주세요', 'error'); return; }
if (qty > 9) { toast('9개 초과는 관리자 승인이 필요합니다', 'warning'); return; }

// 중복 주문 체크
const today = new Date().toISOString().slice(0, 10);
const dup = STATE.orders.find(o => o.date && o.date.startsWith(today) && o.recipient === recipient && o.productId === productId && o.status !== '취소');
if (dup) {
if (!confirm(`⚠️ 오늘 이미 "${recipient}"님에게 "${p.name}" 주문이 있습니다. 그래도 주문하시겠습니까?`)) return;
}

// 10개 이상 승인 요청
if (qty >= 10) {
STATE.approvals.push({
staffId: currentUser.id, productId, productName: p.name, productCode: p.code,
optionFull, optionName: optionParsed.name, qty, price: p.price, margin: p.margin,
recipient, phone, zipcode, address, addressDetail, message
});
saveApprovals();
document.getElementById('orderModal').remove();
toast('10개 이상 주문 → 관리자 승인 요청됨', 'warning');
return;
}

const order = {
id: generateId(), staffId: currentUser.id, productId, productName: p.name,
productCode: p.code, optionFull, optionName: optionParsed.name,
qty, price: p.price, margin: p.margin, recipient, phone, zipcode,
address, addressDetail, message, date: new Date().toISOString(),
status: '미발주', invoice: '', courier: ''
};

STATE.orders.push(order);
saveOrders();

// 수령인 저장
saveRecipient(recipient, phone, zipcode, address, addressDetail);

document.getElementById('orderModal').remove();
toast(`주문 완료! (인센티브: ${formatNum(calcIncentive(qty))}원)`);
}

function saveRecipient(name, phone, zipcode, address, addressDetail) {
if (!STATE.recipients) STATE.recipients = [];
const existing = STATE.recipients.find(r => r.name === name);
if (existing) {
existing.phone = phone;
existing.zipcode = zipcode;
existing.address = address;
existing.addressDetail = addressDetail;
} else {
STATE.recipients.push({name, phone, zipcode, address, addressDetail});
}
db.ref('state/recipients').set(STATE.recipients);
}

// ========== 장바구니 ==========
function addToCart(productId) {
const p = STATE.products.find(pr => pr.id === productId);
if (!p) return;

const option = p.options.length > 0 ? prompt(`옵션 선택:\n${p.options.map((o,i)=>`${i+1}. ${o}`).join('\n')}\n\n번호를 입력하세요:`) : null;
let selectedOption = '';
if (p.options.length > 0) {
const idx = Number(option) - 1;
if (idx >= 0 && idx < p.options.length) selectedOption = p.options[idx];
else { toast('올바른 옵션을 선택하세요', 'error'); return; }
}

const qty = Number(prompt('수량 (최대 9개):', '1'));
if (!qty || qty < 1 || qty > 9) { toast('수량은 1~9개입니다', 'error'); return; }

cart.push({productId, productName: p.name, productCode: p.code, option: selectedOption, qty, price: p.price, margin: p.margin, image: p.image});
document.getElementById('cartCount').textContent = cart.length;
toast(`${p.name} 장바구니 추가`);
}

function openCart() {
if (cart.length === 0) { toast('장바구니가 비어있습니다', 'warning'); return; }

const overlay = document.createElement('div');
overlay.className = 'modal-overlay';
overlay.id = 'cartModal';
overlay.innerHTML = `
<div class="modal modal-lg">
<h3>🛒 장바구니 (${cart.length}개 상품)</h3>
<div class="table-wrap"><table>
<thead><tr><th>상품</th><th>옵션</th><th>수량</th><th>가격</th><th>인센티브</th><th>삭제</th></tr></thead>
<tbody>${cart.map((c, i) => `<tr>
<td>${c.image ? `<img src="${c.image}" style="width:30px;height:30px;border-radius:4px;vertical-align:middle"> ` : ''}${c.productName}</td>
<td>${c.option || '-'}</td>
<td>${c.qty}</td>
<td>${formatNum(c.price * c.qty)}원</td>
<td>${formatNum(calcIncentive(c.qty))}원</td>
<td><button class="btn btn-sm btn-danger" onclick="removeFromCart(${i})">X</button></td>
</tr>`).join('')}</tbody>
</table></div>
<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">
<label><input type="checkbox" id="cartDiffRecipient" onchange="toggleCartRecipient()"> 상품별 다른 수령인</label>
</div>
<div id="cartRecipientSection">
<h4 style="margin:12px 0 8px">공통 수령인 정보</h4>
<div class="form-group"><label>수령인</label><input type="text" id="cartRecipient"></div>
<div class="form-group"><label>연락처</label><input type="text" id="cartPhone" placeholder="010-0000-0000"></div>
<div class="form-group"><label>우편번호</label><div style="display:flex;gap:8px"><input type="text" id="cartZipcode" readonly style="flex:1"><button class="btn btn-sm btn-outline" onclick="searchCartAddress()">주소검색</button></div></div>
<div class="form-group"><label>배송주소</label><input type="text" id="cartAddress" readonly></div>
<div class="form-group"><label>상세주소</label><input type="text" id="cartAddressDetail"></div>
</div>
<div id="cartIndividualSection" class="hidden"></div>
<div style="display:flex;gap:8px;margin-top:16px">
<button class="btn btn-primary" onclick="submitCart()">전체 주문하기</button>
<button class="btn btn-outline" onclick="document.getElementById('cartModal').remove()">닫기</button>
</div>
</div>
`;
document.body.appendChild(overlay);
}

function removeFromCart(idx) {
cart.splice(idx, 1);
document.getElementById('cartCount').textContent = cart.length;
document.getElementById('cartModal').remove();
if (cart.length > 0) openCart();
else toast('장바구니 비워짐');
}

function toggleCartRecipient() {
const diff = document.getElementById('cartDiffRecipient').checked;
document.getElementById('cartRecipientSection').classList.toggle('hidden', diff);
const section = document.getElementById('cartIndividualSection');
section.classList.toggle('hidden', !diff);
if (diff) {
section.innerHTML = cart.map((c, i) => `
<div style="border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px">
<strong>${c.productName}</strong> (${c.option || '-'})
<div class="form-group"><label>수령인</label><input type="text" id="ciRecipient${i}"></div>
<div class="form-group"><label>연락처</label><input type="text" id="ciPhone${i}"></div>
<div class="form-group"><label>우편번호</label><div style="display:flex;gap:8px"><input type="text" id="ciZip${i}" readonly style="flex:1"><button class="btn btn-sm btn-outline" onclick="searchCartAddrIdx(${i})">주소검색</button></div></div>
<div class="form-group"><label>주소</label><input type="text" id="ciAddr${i}" readonly></div>
<div class="form-group"><label>상세주소</label><input type="text" id="ciDetail${i}"></div>
</div>
`).join('');
}
}

function searchCartAddress() {
new daum.Postcode({
oncomplete: function(data) {
document.getElementById('cartZipcode').value = data.zonecode;
document.getElementById('cartAddress').value = data.roadAddress || data.jibunAddress;
}
}).open();
}

function searchCartAddrIdx(idx) {
new daum.Postcode({
oncomplete: function(data) {
document.getElementById(`ciZip${idx}`).value = data.zonecode;
document.getElementById(`ciAddr${idx}`).value = data.roadAddress || data.jibunAddress;
}
}).open();
}

function submitCart() {
const diff = document.getElementById('cartDiffRecipient')?.checked || false;

cart.forEach((c, i) => {
let recipient, phone, zipcode, address, addressDetail;
if (diff) {
recipient = document.getElementById(`ciRecipient${i}`)?.value?.trim();
phone = document.getElementById(`ciPhone${i}`)?.value?.trim();
zipcode = document.getElementById(`ciZip${i}`)?.value?.trim();
address = document.getElementById(`ciAddr${i}`)?.value?.trim();
addressDetail = document.getElementById(`ciDetail${i}`)?.value?.trim();
} else {
recipient = document.getElementById('cartRecipient')?.value?.trim();
phone = document.getElementById('cartPhone')?.value?.trim();
zipcode = document.getElementById('cartZipcode')?.value?.trim();
address = document.getElementById('cartAddress')?.value?.trim();
addressDetail = document.getElementById('cartAddressDetail')?.value?.trim();
}

if (!recipient || !phone || !address) { toast(`${c.productName}: 수령인 정보를 입력하세요`, 'error'); return; }

const optParsed = parseOption(c.option || '');
const order = {
id: generateId(), staffId: currentUser.id, productId: c.productId,
productName: c.productName, productCode: c.productCode,
optionFull: c.option, optionName: optParsed.name,
qty: c.qty, price: c.price, margin: c.margin,
recipient, phone, zipcode, address, addressDetail,
message: '', date: new Date().toISOString(),
status: '미발주', invoice: '', courier: ''
};
STATE.orders.push(order);
saveRecipient(recipient, phone, zipcode, address, addressDetail);
});

saveOrders();
cart = [];
document.getElementById('cartCount').textContent = '0';
document.getElementById('cartModal').remove();
toast('장바구니 주문 완료!');
}

// ========== 내 주문 (직원) ==========
function renderMyOrders(container) {
const myOrders = STATE.orders.filter(o => o.staffId === currentUser.id).reverse();
container.innerHTML = `
<div class="card">
<h2>내 주문 내역</h2>
<div class="table-wrap"><table>
<thead><tr><th>일시</th><th>상품</th><th>옵션</th><th>수량</th><th>수령인</th><th>상태</th><th>송장</th><th>관리</th></tr></thead>
<tbody>
${myOrders.map(o => `<tr>
<td>${formatDate(o.date)}</td>
<td>${o.productName}</td>
<td>${o.optionName || ''}</td>
<td>${o.qty}</td>
<td>${o.recipient}</td>
<td><span class="status-badge status-${o.status === '미발주' ? 'unordered' : o.status === '발주완료' ? 'ordered' : o.status === '배송중' ? 'shipping' : 'cancelled'}">${o.status}</span></td>
<td>${o.invoice ? `<a href="${getTrackingUrl(o.courier, o.invoice)}" target="_blank">${o.courier} ${o.invoice}</a>` : '-'}</td>
<td>${o.status === '미발주' ? `<button class="btn btn-sm btn-danger" onclick="staffCancelOrder('${o.id}')">취소</button> <button class="btn btn-sm btn-outline" onclick="staffCopyOrder('${o.id}')">복사</button>` : `<button class="btn btn-sm btn-outline" onclick="staffCopyOrder('${o.id}')">재주문</button>`}</td>
</tr>`).join('')}
</tbody>
</table></div>
</div>
`;
}

function staffCancelOrder(orderId) {
if (!confirm('이 주문을 취소하시겠습니까?')) return;
const order = STATE.orders.find(o => o.id === orderId);
if (order && order.status === '미발주') {
order.status = '취소';
saveOrders();
renderMyOrders(document.getElementById('mainContainer'));
toast('주문 취소됨');
}
}

function staffCopyOrder(orderId) {
const order = STATE.orders.find(o => o.id === orderId);
if (!order) return;
const p = STATE.products.find(pr => pr.id === order.productId);
if (p) quickOrder(p.id);
}

// ========== 내 매출 (직원) ==========
function renderMySales(container) {
const myOrders = STATE.orders.filter(o => o.staffId === currentUser.id && o.status !== '취소');
const thisMonth = new Date().toISOString().slice(0, 7);
const monthOrders = myOrders.filter(o => o.date && o.date.startsWith(thisMonth));
const totalSales = monthOrders.reduce((s, o) => s + o.price * o.qty, 0);
const totalMargin = monthOrders.reduce((s, o) => s + (o.margin || 0) * o.qty, 0);
const totalIncentive = monthOrders.reduce((s, o) => s + calcIncentive(o.qty), 0);

container.innerHTML = `
<div class="stats-grid">
<div class="stat-card"><div class="stat-value">${monthOrders.length}</div><div class="stat-label">이번 달 주문</div></div>
<div class="stat-card"><div class="stat-value">${formatNum(totalSales)}원</div><div class="stat-label">매출</div></div>
<div class="stat-card"><div class="stat-value">${formatNum(totalIncentive)}원</div><div class="stat-label">인센티브</div></div>
</div>
<div class="card">
<h2>이번 달 주문 내역</h2>
<div class="table-wrap"><table>
<thead><tr><th>일시</th><th>상품</th><th>수량</th><th>판매가</th><th>인센티브</th></tr></thead>
<tbody>
${monthOrders.map(o => `<tr>
<td>${formatDate(o.date)}</td><td>${o.productName}</td><td>${o.qty}</td>
<td>${formatNum(o.price * o.qty)}원</td><td>${formatNum(calcIncentive(o.qty))}원</td>
</tr>`).join('')}
</tbody>
</table></div>
</div>
`;
}

// ========== 초기화 ==========
async function init() {
await loadState();
populateStaffSelect();
handleModeChange();
// 실시간 동기화
db.ref('state').on('value', (snapshot) => {
const data = snapshot.val();
if (data) {
STATE = {...STATE, ...data};
if (!STATE.approvals) STATE.approvals = [];
if (!STATE.recipients) STATE.recipients = [];
updateApprovalCount();
}
});
}

init();
</script>
</body>
</html>
